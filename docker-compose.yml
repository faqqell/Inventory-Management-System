version: '3.8'

services:
  db:
    image: postgres:16
    container_name: inventory-postgres
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - inventory-postgres-data:/var/lib/postgresql/data

volumes:
  inventory-postgres-data: